<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - Leafix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent-start: #c5f082;
      --accent-mid: #d4ff6f;
      --accent-end: #81c784;
      --text: #f1f8e9;
      --text-dim: #c8e6c9;
      --card-bg: rgba(42, 61, 51, 0.68);
      --input-bg: rgba(30, 45, 38, 0.75);
      --glow: rgba(197, 240, 130, 0.35);
      --error: #ef5350;
      --success: #81c784;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      color: var(--text);
      background: #0d1a12;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url('https://i.pinimg.com/736x/c0/a8/a7/c0a8a72d665bedaae18d457e01e9986c.jpg') center/cover no-repeat;
      opacity: 0.72;
      filter: brightness(0.62) saturate(0.90) contrast(1.10);
      z-index: -2;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 50, 35, 0.48);
      backdrop-filter: blur(2px);
      z-index: -1;
    }

    .leaves-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .leaf {
      position: absolute;
      width: 70px;
      height: 90px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.32;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-120vh) rotate(0deg) translateX(0); opacity: 0; }
      10% { opacity: 0.50; }
      90% { opacity: 0.42; }
      100% { transform: translateY(120vh) rotate(720deg) translateX(var(--sway)); opacity: 0; }
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      padding: 1.2rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 32, 22, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(129,199,132,0.30);
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #c5f082;
      letter-spacing: 1.5px;
    }

    .nav-links {
      display: flex;
      gap: 2.4rem;
    }

    .nav-links a {
      color: var(--text-dim);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.98rem;
      transition: color 0.3s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #c5f082;
    }

    main {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 140px 5% 80px;
      position: relative;
      z-index: 5;
    }

    .register-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 20px 70px rgba(0,0,0,0.65);
      border: 1px solid rgba(129,199,132,0.25);
      backdrop-filter: blur(12px);
    }

    .register-title {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 2.8rem;
      text-align: center;
      background: linear-gradient(90deg, #c5f082, #d4ff6f, #81c784);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2.5rem;
      text-shadow: 0 0 20px var(--glow);
    }

    .form-group {
      position: relative;
      margin-bottom: 2.2rem;
    }

    .form-group input {
      width: 100%;
      padding: 1.1rem 4.5rem 1.1rem 1.3rem;
      border: 1px solid rgba(129,199,132,0.35);
      border-radius: 12px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #c5f082;
      box-shadow: 0 0 0 4px rgba(197,240,130,0.18);
    }

    .form-group label {
      position: absolute;
      top: 1.1rem;
      left: 1.3rem;
      color: var(--text-dim);
      pointer-events: none;
      transition: all 0.3s ease;
      font-size: 1rem;
    }

    .form-group input:focus + label,
    .form-group input:not(:placeholder-shown) + label {
      top: -0.9rem;
      left: 1rem;
      font-size: 0.85rem;
      background: var(--card-bg);
      padding: 0 0.5rem;
      color: #c5f082;
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.3s;
    }

    .toggle-password:hover {
      color: #c5f082;
    }

    .signup-btn {
      width: 100%;
      background: linear-gradient(135deg, #a4e44d, #d4ff6f, #81c784);
      color: #0f1a0f;
      border: none;
      padding: 1.1rem;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.35s ease;
      box-shadow: 0 10px 35px rgba(102,187,106,0.4);
      margin-top: 1.8rem;
    }

    .signup-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 50px rgba(102,187,106,0.55);
    }

    .message {
      margin: 1.5rem 0;
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
      font-weight: 500;
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .success {
      background: rgba(129,199,132,0.22);
      color: #c5f082;
      border: 1px solid rgba(129,199,132,0.45);
    }

    .error {
      background: rgba(239,83,80,0.22);
      color: #ef5350;
      border: 1px solid rgba(239,83,80,0.45);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-link {
      text-align: center;
      margin-top: 2rem;
      color: var(--text-dim);
      font-size: 0.98rem;
    }

    .login-link a {
      color: #c5f082;
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      color: #d4ff6f;
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 3rem 5% 2rem;
      color: var(--text-dim);
      font-size: 0.95rem;
      border-top: 1px solid rgba(129,199,132,0.15);
    }

    @media (max-width: 768px) {
      nav { padding: 1rem 5%; flex-direction: column; gap: 1rem; }
      .nav-links { flex-wrap: wrap; justify-content: center; gap: 1.4rem; }
      main { padding: 120px 5% 60px; }
      .register-card { padding: 2.2rem 1.8rem; }
    }
  </style>
</head>
<body>

<div class="overlay"></div>
<div class="leaves-bg" id="leaves"></div>

<nav>
  <div class="logo">LEAFIX</div>
  <div class="nav-links">
    <a href="{% url 'index' %}">Home</a>
    <a href="{% url 'login' %}">Sign in</a>
    <a href="#" class="active">Sign up</a>
    <a href="{% url 'adminLogin' %}">Admin</a>
    <a href="{% url 'indexabout' %}">About</a>
  </div>
</nav>

<main>
  <div class="register-card">
    <h1 class="register-title">Create Account</h1>

    <form method="post" id="registerForm" action="{% url 'createaccount' %}">
      {% csrf_token %}

      <div class="form-group">
        <input name="username" type="text" id="username" required placeholder=" ">
        <label for="username">Username</label>
      </div>

      <div class="form-group">
        <input name="age" type="number" id="age" min="13" max="120" required placeholder=" ">
        <label for="age">Age</label>
      </div>

      <div class="form-group">
        <input name="email" type="email" id="email" required placeholder=" ">
        <label for="email">Email</label>
      </div>

      <div class="form-group password-wrapper">
        <input type="password" id="password" name="password" required placeholder=" ">
        <label for="password">Password</label>
        <button type="button" class="toggle-password" onclick="togglePassword('password')">Show</button>
      </div>

      <div class="form-group password-wrapper">
        <input type="password" id="confirmpassword" required placeholder=" ">
        <label for="confirmpassword">Confirm Password</label>
        <button type="button" class="toggle-password" onclick="togglePassword('confirmpassword')">Show</button>
      </div>

      <div id="message" class="message"></div>

      <button type="submit" class="signup-btn">Sign Up</button>
    </form>

    <div class="login-link">
      Already have an account? <a href="{% url 'login' %}">sign in here</a>
    </div>
  </div>
</main>

<footer>
  © 2026 Leafix — Made with love for healthier plants and better harvests.
</footer>

<script>
// Falling leaves animation (optional - remove if not needed)
const leafImages = [
  'https://static.vecteezy.com/system/resources/thumbnails/040/216/920/small/ai-generated-mango-leaf-clip-art-free-png.png?w=120',
  'https://static.vecteezy.com/system/resources/thumbnails/022/218/957/small/yellow-leaves-isolated-on-a-transparent-background-png.png?w=120',
  'https://static.vecteezy.com/system/resources/thumbnails/022/025/136/small/brown-dried-leaf-isolated-on-a-transparent-background-png.png?w=120',
  'https://static.vecteezy.com/system/resources/thumbnails/040/216/920/small/ai-generated-mango-leaf-clip-art-free-png.png?w=120',
  'https://pngfile.net/files/preview/1280x678/43817508871430jtlwdim482dx4cknq4d5re1ajvldggkgcqj7yvoze1htnp0y9ykzqc548zpw3d6d9gkqfq0lsu2z5k78n2ej0ltiq3jluycisqu.png?w=120'
];

function createLeaf() {
  const leaf = document.createElement('div');
  leaf.className = 'leaf';
  const randomImg = leafImages[Math.floor(Math.random() * leafImages.length)];
  leaf.style.backgroundImage = `url('${randomImg}')`;
  const scale = 0.5 + Math.random() * 1.1;
  leaf.style.width = (70 * scale) + 'px';
  leaf.style.height = (90 * scale) + 'px';
  leaf.style.left = Math.random() * 100 + 'vw';
  const duration = 30 + Math.random() * 20;
  leaf.style.animationDuration = duration + 's';
  leaf.style.animationDelay = Math.random() * 5 + 's';
  const sway = (Math.random() - 0.5) * 140 + 'vw';
  leaf.style.setProperty('--sway', sway);
  leaf.style.transform = `rotate(${Math.random() * 140 - 70}deg)`;
  document.getElementById('leaves').appendChild(leaf);
  setTimeout(() => leaf.remove(), (duration + 8) * 1000);
}

for (let i = 0; i < 24; i++) setTimeout(createLeaf, i * 250);
setInterval(createLeaf, 2800);

// Password toggle: Show / Hide text
function togglePassword(fieldId) {
  const input = document.getElementById(fieldId);
  const btn = event.target;

  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = 'Hide';
  } else {
    input.type = 'password';
    btn.textContent = 'Show';
  }
}

// Form validation + real submission
document.getElementById('registerForm').addEventListener('submit', function(e) {
  e.preventDefault(); // Temporarily stop to validate

  const username = document.getElementById('username').value.trim();
  const age = document.getElementById('age').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirmpassword = document.getElementById('confirmpassword').value;
  const messageEl = document.getElementById('message');

  // Reset UI
  messageEl.style.display = 'none';
  messageEl.className = 'message';
  document.querySelectorAll('input').forEach(el => el.style.borderColor = '');

  // Validation
  if (!username || !age || !email || !password || !confirmpassword) {
    showMessage('Please fill in all fields', 'error');
    return;
  }

  if (isNaN(age) || age < 13 || age > 120) {
    showMessage('Age must be between 13 and 120', 'error');
    document.getElementById('age').style.borderColor = 'var(--error)';
    return;
  }

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showMessage('Please enter a valid email address', 'error');
    document.getElementById('email').style.borderColor = 'var(--error)';
    return;
  }

  if (password.length < 8) {
    showMessage('Password must be at least 8 characters long', 'error');
    document.getElementById('password').style.borderColor = 'var(--error)';
    return;
  }
  if (!/[A-Z]/.test(password)) {
    showMessage('Password must contain at least one uppercase letter', 'error');
    document.getElementById('password').style.borderColor = 'var(--error)';
    return;
  }
  if (!/[a-z]/.test(password)) {
    showMessage('Password must contain at least one lowercase letter', 'error');
    document.getElementById('password').style.borderColor = 'var(--error)';
    return;
  }
  if (!/[0-9]/.test(password)) {
    showMessage('Password must contain at least one number', 'error');
    document.getElementById('password').style.borderColor = 'var(--error)';
    return;
  }
  if (!/[^A-Za-z0-9]/.test(password)) {
    showMessage('Password must contain at least one special character', 'error');
    document.getElementById('password').style.borderColor = 'var(--error)';
    return;
  }

  if (password !== confirmpassword) {
    showMessage('Passwords do not match', 'error');
    document.getElementById('confirmpassword').style.borderColor = 'var(--error)';
    return;
  }

  // All good → show success and submit to Django
  showMessage('Registration successful! Saving...', 'success');

  // Actually submit the form (sends POST to Django)
  this.submit();
});

function showMessage(text, type) {
  const msg = document.getElementById('message');
  msg.textContent = text;
  msg.className = `message ${type}`;
  msg.style.display = 'block';
  msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
</script>

</body>
</html>
