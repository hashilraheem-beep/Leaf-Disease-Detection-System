<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login • Leafix</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --bg-main: #0a0a0a;
      --bg-card: #0f0f0f;
      --text-main: #e5e5e5;
      --text-muted: #888;
      --green: #00ff9d;
      --green-dark: #00d584;
      --green-glow: rgba(0, 255, 157, 0.22);
      --border: #222;
      --error: #ff4d4d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Gentle animated background orb */
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle at 30% 40%, var(--green-glow), transparent 60%);
      top: -20%;
      left: -15%;
      border-radius: 50%;
      opacity: 0.4;
      animation: floatOrb 18s infinite ease-in-out;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(120px, 80px) scale(1.15); }
    }

    .login-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3.2rem 2.8rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 80px rgba(0, 255, 157, 0.09),
                  inset 0 0 40px rgba(0, 255, 157, 0.03);
      position: relative;
      z-index: 1;
      backdrop-filter: blur(6px);
    }

    .logo {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--green);
      text-align: center;
      margin-bottom: 2.2rem;
      letter-spacing: -1.5px;
      animation: breathe 4s infinite ease-in-out;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.92; transform: scale(1); }
      50%      { opacity: 1;    transform: scale(1.04); }
    }

    h1 {
      font-size: 1.95rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 2.4rem;
      color: #f0f0f0;
    }

    .form-group {
      position: relative;
      margin-bottom: 2rem;
    }

    label {
      position: absolute;
      left: 1.3rem;
      top: 1.1rem;
      color: var(--text-muted);
      font-size: 1rem;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 1.25rem 1.3rem 0.6rem;
      background: #161616;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 1.05rem;
      transition: all 0.25s ease;
    }

    input:focus,
    input:not(:placeholder-shown) {
      border-color: var(--green);
      box-shadow: 0 0 0 4px var(--green-glow);
    }

    input:focus + label,
    input:not(:placeholder-shown) + label {
      top: 0.5rem;
      font-size: 0.82rem;
      color: var(--green);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 1.6rem 0 2.4rem;
      font-size: 0.96rem;
      color: var(--text-muted);
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .remember input {
      accent-color: var(--green);
      width: 1.1rem;
      height: 1.1rem;
    }

    .forgot {
      color: var(--green);
      text-decoration: none;
      transition: all 0.2s;
    }

    .forgot:hover {
      color: #aaffd0;
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      padding: 1.15rem;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      color: #000;
      border: none;
      border-radius: 12px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 255, 157, 0.35);
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease;
      pointer-events: none;
    }

    .btn:active::before {
      width: 300px;
      height: 300px;
      opacity: 0;
    }

    .error-message {
      color: var(--error);
      font-size: 0.88rem;
      margin-top: 0.5rem;
      display: none;
    }

    .footer-text {
      text-align: center;
      margin-top: 2.4rem;
      color: #555;
      font-size: 0.9rem;
    }

    .back-btn {
      position: absolute;
      top: 1.8rem;
      left: 1.8rem;
      color: var(--text-muted);
      font-size: 1.2rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      z-index: 2;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      color: var(--green);
      transform: translateX(-6px);
    }

    .back-btn i {
      font-size: 1.4rem;
    }
  </style>
</head>
<body>

  <a href="javascript:history.back()" class="back-btn" title="Go back">
    <i class="fas fa-arrow-left"></i> 
  </a>

  <div class="login-container">
    <div class="logo">Sign in</div>
    <h1></h1>

    <form class="signin-form" method="post" action="{% url 'Login' %}">
      {% csrf_token %}

      <div class="form-group">
        <input name="user_name" type="text" id="username" placeholder=" " required>
        <label for="username">Username</label>
        <div class="error-message" id="usernameError">This field is required</div>
      </div>

      <div class="form-group">
        <input name="pass_word" type="password" id="password" placeholder=" " required>
        <label for="password">Password</label>
        <div class="error-message" id="passwordError">This field is required</div>
      </div>

      <div class="options">
       
        <a href="#" class="forgot"></a>
      </div>

      <button type="submit" class="btn">Login</button>
    </form>

    <div class="footer-text">
      © 2026 Leafix Admin Panel
    </div>
  </div>

  <script>
    // Very basic client-side validation (optional)
    document.querySelector('form').addEventListener('submit', function(e) {
      let valid = true;
      document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');

      const username = document.getElementById('username');
      const password = document.getElementById('password');

      if (!username.value.trim()) {
        document.getElementById('usernameError').style.display = 'block';
        valid = false;
      }
      if (!password.value.trim()) {
        document.getElementById('passwordError').style.display = 'block';
        valid = false;
      }

      if (!valid) {
        e.preventDefault();
      }
      // else → form submits to Django view
    });
  </script>

</body>
</html>
